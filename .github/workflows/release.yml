name: release

# Push a tag like v0.2.1 to build, package and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from the tag
        id: version
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test host/PassTheStick.slnx --configuration Release

      - name: Publish
        run: >
          dotnet publish host/PassTheStick.App -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.value }} -p:DebugType=None -p:SatelliteResourceLanguages=en
          -o artifacts/publish

      # Optional code signing with SignPath (free for qualifying open-source projects). It runs only when the
      # SIGNPATH_API_TOKEN secret exists, so unsigned releases still work until the account is set up.
      # The organisation id, project and policy slugs are repository variables. See HANDOFF.md for the setup steps.
      - name: Upload files for signing
        id: unsigned
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: artifacts/publish
      - name: Sign
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed
      - name: Use the signed files
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        run: Copy-Item artifacts/signed/* artifacts/publish -Recurse -Force

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Fetch earlier releases so the new one can ship delta updates
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Package
        run: >
          vpk pack --packId PassTheStick --packVersion ${{ steps.version.outputs.value }}
          --packDir artifacts/publish --mainExe PassTheStick.exe --packTitle PassTheStick
          --packAuthors "PassTheStick contributors" --icon design/generated/icons/passthestick.ico
          --outputDir artifacts/releases

      - name: Publish the release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --publish --releaseName "PassTheStick ${{ steps.version.outputs.value }}"
          --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir artifacts/releases

      - name: Winget manifest
        run: ./scripts/make-winget.ps1 -Version ${{ steps.version.outputs.value }} -Repository ${{ github.repository }} -Installer artifacts/releases/PassTheStick-win-Setup.exe -OutDir artifacts/winget

      - name: Attach the winget manifest to the release
        run: gh release upload ${{ github.ref_name }} artifacts/winget/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
