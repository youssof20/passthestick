name: ci

on:
  pull_request:
  push:
    branches: [main, revamp]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  host:
    name: Host (build and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test host/PassTheStick.slnx --configuration Release
      - name: Publish the app (proves the release build works)
        run: dotnet publish host/PassTheStick.App -c Release -r win-x64 --self-contained -p:DebugType=None -p:SatelliteResourceLanguages=en -o artifacts/publish

  worker:
    name: Worker (types and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web guest (types, tests, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/guest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/guest/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node build.mjs

  design:
    name: Design tokens (contrast and generated files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate tokens (fails on any contrast miss)
        run: node scripts/gen-design.mjs
      - name: Generated files must be committed
        run: git diff --exit-code -- design/generated site/css/tokens.css
